name: Panel release binaries
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: panel/web/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache-dependency-path: panel/go.sum
      - run: python3 tools/build.py --check
      - run: npm ci && npm run build && npm run lint && npm test && npm audit --audit-level=high
        working-directory: panel/web
      - run: go test -race ./... && go vet ./...
        working-directory: panel
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: panel
      - name: Package Linux binaries
        run: python3 tools/package_panel.py
      - name: Publish checked packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(bash gre.sh --version)"
          if ! gh release view "$version" >/dev/null 2>&1; then
            gh release create "$version" --title "GRE Tunnel Manager $version" --notes-file panel/RELEASE.md --target "$GITHUB_SHA"
          fi
          gh release upload "$version" panel/bin/*.tar.gz panel/bin/SHA256SUMS --clobber
