name: Panel release binaries
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require a matching release tag
        run: |
          version="$(bash gre.sh --version)"
          [[ "$GITHUB_REF" == "refs/tags/$version" ]] || { echo 'Select the matching version tag; source branches cannot replace a published package.' >&2; exit 1; }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: panel/web/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache-dependency-path: panel/go.sum
      - run: python3 tools/build.py --check
      - run: npm ci && npm run build && npm run lint && npm test && npm audit --audit-level=high
        working-directory: panel/web
      - run: go test -race ./... && go vet ./...
        working-directory: panel
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: panel
      - name: Package Linux binaries
        run: python3 tools/package_panel.py
      - run: env GTM_PANEL_TEST_BINARY="$PWD/panel/bin/gtm-panel-linux-amd64" python3 -m unittest discover -s tests -p test_panel_setup_pty.py -v
      - name: Publish checked packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(bash gre.sh --version)"
          gh release create "$version" panel/bin/*.tar.gz panel/bin/SHA256SUMS \
            --verify-tag --title "GRE Tunnel Manager $version" \
            --notes-file panel/RELEASE.md --target "$GITHUB_SHA"
