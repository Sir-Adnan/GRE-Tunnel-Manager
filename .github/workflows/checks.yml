name: Bash and configuration checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python tools/build.py --check
      - run: python -m unittest discover -s tests -v
      - run: sudo apt-get update && sudo apt-get install -y nftables iptables haproxy socat shellcheck
      - run: shellcheck -s bash -S warning -e SC2034 src/{core,server_info,ui,haproxy,realm_options,state,firewall,relays,transports,rathole,catalog,inspect,forms,tuning,cleanup,links,reverse_api,api,panel,menus}.sh panel-install.sh
      - run: sudo bash tests/linux_namespace.sh
  panel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: panel/web/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: panel/go.sum
      - run: npm ci && npm run build && npm run lint && npm audit --audit-level=high
        working-directory: panel/web
      - run: go test -race ./... && go vet ./... && CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o bin/gtm-panel-linux-amd64 ./cmd/gtm-panel
        working-directory: panel
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: panel
      - run: sudo apt-get update && sudo apt-get install -y nftables iptables haproxy socat
      - run: sudo env GTM_PANEL_TEST_BINARY="$PWD/panel/bin/gtm-panel-linux-amd64" bash tests/linux_namespace.sh
