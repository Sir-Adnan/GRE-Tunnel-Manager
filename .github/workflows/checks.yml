name: Bash and configuration checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python tools/build.py --check
      - run: python -m unittest discover -s tests -v
      - run: sudo apt-get update && sudo apt-get install -y nftables iptables haproxy socat shellcheck
      - run: shellcheck -s bash -S warning -e SC2034 src/{core,server_info,ui,haproxy,state,firewall,relays,transports,rathole,catalog,inspect,forms,tuning,cleanup,menus}.sh
      - run: sudo bash tests/linux_namespace.sh
